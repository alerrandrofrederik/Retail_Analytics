# The data contract between the data platform and the RYStore source (skill contract).
# Open Data Contract Standard (ODCS) v3.1.0, validated against its JSON Schema.
# Version 1.0.0, agreed on 2026-10-30: written from the profile (reports/profile/rystore_profile.html)
# and the metadata (metadata/rystore.yaml); the answers to the open points are in
# contracts/rystore_open_points.md. Columns, types, keys and descriptions come from the metadata,
# never retyped. It describes the data, never the pipeline.

kind: DataContract
apiVersion: v3.1.0
id: rystore
name: rystore
version: 1.0.0
status: active
description:
  purpose: The sales, stock and master data of the RYStore supermarket (the company's simulated OLTP in Supabase), delivered
    as one CSV per table to the data platform.
  limitations: Agreed on 2026-10-30. The answers to every open point are in contracts/rystore_open_points.md. Column descriptions
    are still the generic texts of the source dictionary.
servers:
  - server: supabase-storage
    type: s3
    location: s3://rystore/{table}/
    format: csv
    description: 'Supabase Storage, read through its S3-compatible API: one CSV per table in the bucket rystore. orders and
      order_items in one folder per delivery day (dt=yyyy-MM-dd); the other tables as one complete file per day. The endpoint
      and the keys live in the secrets of the data platform, never here.'
team:
  name: rystore
  members:
    - username: rystore-owner
      role: owner
      description: The data engineer of the project answers for the source and its delivery.
    - username: data-platform
      role: consumer
      description: Loads the files and runs the checks of this contract.
support:
  - channel: github-issues
    tool: ticket
    url: https://github.com/alerrandrofrederik/Retail_Analytics/issues
    description: Questions about a delivery and announcements of a change, as an issue of the project repository.
slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: One delivery every day.
  - property: timeOfAvailability
    value: 06:00+00:00
    description: The delivery of the day is in the bucket by 06:00 UTC.
customProperties:
  - property: changeNotice
    value: 7 days
    description: A change of the schema, the format or a closed list of values is announced 7 days before, with a new version
      of this contract.
  - property: timezone
    value: Europe/London
    description: orders.order_datetime is local UK time, without offset. In the hour that does not exist (spring change) the
      time moves 1 hour forward; in the hour that repeats (autumn change) it is the first one, BST (+01:00).
  - property: personalData
    value: restricted
    description: Columns with classification restricted hold personal data. The source says all of it is fictional; the platform
      treats it as real and never serves it unmasked.
  - property: revenue
    value: Completed
    description: Revenue counts Completed orders only. Cancelled and Refunded orders are delivered with their status and kept,
      outside revenue.
schema:
  - name: customers
    physicalName: customers.csv
    physicalType: file
    description: 800 loyalty customers. Blank customer_id in orders represents anonymous/non-loyalty purchases.
    customProperties:
      - property: delimiter
        value: ','
      - property: quoting
        value: none
      - property: encoding
        value: ascii
      - property: lineEnding
        value: CRLF
      - property: header
        value: true
      - property: decimalSeparator
        value: .
      - property: nullToken
        value: ''
      - property: load
        value: full
        description: The whole table in every delivery (a snapshot).
      - property: deletes
        value: missing row
        description: A row that is no longer in the snapshot was deleted in the source.
    properties:
      - name: customer_id
        physicalName: customer_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        unique: true
        description: Unique or foreign key identifier depending on table context.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
          - type: library
            metric: invalidValues
            arguments:
              pattern: ^CUST\d{5}$
            mustBe: 0
            dimension: conformity
            description: The format of the identifier.
      - name: first_name
        physicalName: first_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: last_name
        physicalName: last_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: email
        physicalName: email
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: city
        physicalName: city
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: postcode_area
        physicalName: postcode_area
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: signup_date
        physicalName: signup_date
        logicalType: date
        physicalType: DATE
        logicalTypeOptions:
          format: yyyy-MM-dd
        required: true
        description: Date/time value in ISO-style format.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: loyalty_tier
        physicalName: loyalty_tier
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - Bronze
                - Gold
                - Platinum
                - Silver
            mustBe: 0
            dimension: conformity
            description: Closed list, agreed with the source. A new value is a warning, and the source announces it as a change
              of this contract.
            severity: warning
      - name: customer_segment
        physicalName: customer_segment
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - Budget-conscious
                - Convenience shopper
                - Family shopper
                - Health-focused
                - Premium buyer
                - Student
            mustBe: 0
            dimension: conformity
            description: Closed list, agreed with the source. A new value is a warning, and the source announces it as a change
              of this contract.
            severity: warning
      - name: marketing_opt_in
        physicalName: marketing_opt_in
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
    quality:
      - type: library
        metric: duplicateValues
        arguments:
          properties:
            - customer_id
        mustBe: 0
        dimension: uniqueness
        description: The primary key is unique in every delivery.
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        description: Every delivery has rows.
      - type: text
        dimension: conformity
        description: signup_date is the date of joining the loyalty programme. A customer can buy before it, and a sign-up
          after the sales period is valid.
