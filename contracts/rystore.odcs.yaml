# The data contract between the data platform and the RYStore source (skill contract).
# Open Data Contract Standard (ODCS) v3.1.0, validated against its JSON Schema.
# Draft: written from the profile (reports/profile/rystore_profile.html) and the metadata
# (metadata/rystore.yaml), not yet agreed with the source owner. "a definir" = open point,
# listed in contracts/rystore_open_points.md. Columns, types, keys and descriptions come from
# the metadata, never retyped. It describes the data, never the pipeline.

kind: DataContract
apiVersion: v3.1.0
id: rystore
name: rystore
version: 0.1.0
status: draft
description:
  purpose: The sales, stock and master data of the RYStore supermarket (the company's simulated OLTP in Supabase), delivered
    as one CSV per table to the data platform.
  limitations: Draft from the profile and the metadata, not yet agreed with the source owner. Every 'a definir' is in contracts/rystore_open_points.md.
servers:
  - server: supabase-storage
    type: custom
    format: csv
    description: 'Supabase Storage, read through its S3-compatible API. Bucket, path and whether the data comes from Storage
      or PostgreSQL: a definir.'
team:
  name: rystore
  members:
    - username: rystore-owner
      role: owner
      description: 'Owns the RYStore data and answers for the delivery. Person: a definir.'
    - username: data-platform
      role: consumer
      description: Loads the files and runs the checks of this contract.
support:
  - channel: rystore-data
    tool: other
    description: 'Questions about a delivery and announcements of a change. Channel: a definir.'
slaProperties:
  - property: frequency
    value: a definir
    description: How often a delivery arrives.
  - property: timeOfAvailability
    value: a definir
    description: By what time a delivery is available.
customProperties:
  - property: changeNotice
    value: a definir
    description: How many days before a change of the schema or the format the source announces it, with a new version of
      this contract.
  - property: timezone
    value: a definir
    description: The zone of orders.order_datetime (Europe/London or UTC). The data has no offset.
  - property: personalData
    value: restricted
    description: Columns with classification restricted hold personal data. The source says all of it is fictional; the platform
      treats it as real.
schema:
  - name: customers
    physicalName: customers.csv
    physicalType: file
    description: 800 loyalty customers. Blank customer_id in orders represents anonymous/non-loyalty purchases.
    customProperties:
      - property: delimiter
        value: ','
      - property: quoting
        value: none
      - property: encoding
        value: ascii
      - property: lineEnding
        value: CRLF
      - property: header
        value: true
      - property: decimalSeparator
        value: .
      - property: nullToken
        value: ''
      - property: load
        value: full
        description: 'The whole table in every delivery: no change date in the source. Full or changes only is an open point.'
      - property: deletes
        value: a definir
        description: 'No deletion flag: today a deleted row only disappears from the file.'
    properties:
      - name: customer_id
        physicalName: customer_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        unique: true
        description: Unique or foreign key identifier depending on table context.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
          - type: library
            metric: invalidValues
            arguments:
              pattern: ^CUST\d{5}$
            mustBe: 0
            dimension: conformity
            description: The format of the identifier.
      - name: first_name
        physicalName: first_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: last_name
        physicalName: last_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: email
        physicalName: email
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: city
        physicalName: city
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: postcode_area
        physicalName: postcode_area
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: restricted
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: signup_date
        physicalName: signup_date
        logicalType: date
        physicalType: DATE
        logicalTypeOptions:
          format: yyyy-MM-dd
        required: true
        description: Date/time value in ISO-style format.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
      - name: loyalty_tier
        physicalName: loyalty_tier
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
          - type: library
            metric: invalidValues
            arguments:
              validValues:
                - Bronze
                - Gold
                - Platinum
                - Silver
            mustBe: 0
            dimension: conformity
            description: Closed list, as seen in the profile. A new value is a change of this contract.
      - name: customer_segment
        physicalName: customer_segment
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: Categorical or descriptive attribute.
        quality:
