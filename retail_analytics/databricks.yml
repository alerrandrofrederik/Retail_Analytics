# This is a Declarative Automation Bundle definition for retail_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
# The workspace comes from the CLI profile: always run with `-p pessoal`.
bundle:
  name: retail_analytics
  uuid: 8991a673-883e-404a-a6a6-fc0ec446aaf9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use. The layers are its schemas bronze, silver and gold.
  warehouse_id:
    description: The SQL warehouse that publishes the Parquet of the lake as Unity Catalog tables.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    variables:
      catalog: lh_retail_analytics
  prod:
    mode: production
    workspace:
      # A single copy per user, without writing the user name in the repo.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lh_retail_analytics
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
