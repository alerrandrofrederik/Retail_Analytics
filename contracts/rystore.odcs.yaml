                - Family shopper
                - Health-focused
                - Premium buyer
                - Student
            mustBe: 0
            dimension: conformity
            description: Closed list, as seen in the profile. A new value is a change of this contract.
      - name: marketing_opt_in
        physicalName: marketing_opt_in
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: Categorical or descriptive attribute.
        quality:
          - type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            description: 'Required: never empty.'
    quality:
      - type: library
        metric: duplicateValues
        arguments:
          properties:
            - customer_id
        mustBe: 0
        dimension: uniqueness
        description: The primary key is unique in every delivery.
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        description: Every delivery has rows.
