# The daily pipeline of the RYStore source: bronze, silver, gold, then the Unity Catalog tables.
# Plain Python (DuckDB and pyarrow, no Spark) on serverless; the lake is Parquet in the volumes
# <layer>.files. The last task publishes it as Delta tables through the SQL warehouse.
# STANDARD: a daily batch with no tight deadline.
# The source delivers by 06:00 UTC (contracts/rystore.odcs.yaml); the job runs at 07:00 UTC.
# In the dev target the schedule is paused (mode: development).
resources:
  jobs:
    rystore_pipeline:
      name: rystore_pipeline
      performance_target: STANDARD
      tags:
        project: retail_analytics
        source: rystore
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: UTC
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - duckdb==2.0.*
              - pyarrow==26.*
              - boto3==1.43.*
      tasks:
        - task_key: ingest_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/ingest_bronze.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--secret_scope", "retail_analytics", "--bucket", "rystore"]
        - task_key: build_silver
          depends_on:
            - task_key: ingest_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/build_silver.py
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
        - task_key: build_gold
          depends_on:
            - task_key: build_silver
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/build_gold.py
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
        - task_key: publish
          depends_on:
            - task_key: build_gold
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/publish.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--warehouse_id", "${var.warehouse_id}"]
